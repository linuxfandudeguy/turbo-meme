<link rel="apple-touch-icon" href="index.apple-touch-icon.png">

<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background: black;
	overflow: hidden;
	touch-action: none;
}

#canvas { display: block; }
#canvas:focus { outline: none; }

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-width: 100%;
	max-height: 100%;
	margin: auto;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
	display: none;
}

#status-notice {
	background: #5b3943;
	border: 1px solid #9b3943;
	padding: 1rem;
	border-radius: .5rem;
	display: none;
}

#loading-text {
	font-weight: bold;
	font-family: cursive;
	font-size: 48px;
	text-align: center;
	margin-top: 20px;
	background: linear-gradient(
		270deg,
		#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff
	);
	background-size: 400% 400%;
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	animation: rainbow 3s ease infinite;
}

@keyframes rainbow {
	0% { background-position: 0% 50%; }
	50% { background-position: 100% 50%; }
	100% { background-position: 0% 50%; }
}
</style>

</head>

<body>

<div id="loading-text">LOADING...</div>

<canvas id="canvas"></canvas>

<div id="status">
	<img id="status-splash" src="index.png">
	<progress id="status-progress"></progress>
	<div id="status-notice"></div>
</div>

<script>
window.loadingtexta = document.getElementById("loading-text");
</script>

<script>
const originalFetch = window.fetch;

async function fetchWithProgress(url) {
	const res = await fetch(url);
	const reader = res.body.getReader();

	let chunks = [];
	let received = 0;

	while (true) {
		const { done, value } = await reader.read();
		if (done) break;

		received += value.length;
		chunks.push(value);

		let mbDone = (received / 1024 / 1024).toFixed(2);
		window.loadingtexta.textContent = `LOADING... ${mbDone} MB`;
	}

	let full = new Uint8Array(received);
	let offset = 0;
	for (let c of chunks) {
		full.set(c, offset);
		offset += c.length;
	}

	return full.buffer;
}

async function mergeFiles(parts) {
	const buffers = await Promise.all(
		parts.map(fetchWithProgress)
	);

	return URL.createObjectURL(new Blob(buffers));
}

function getParts(file, start, end) {
	let out = [];
	for (let i = start; i <= end; i++) {
		out.push(file + ".part" + i);
	}
	return out;
}

Promise.all([
	mergeFiles(getParts("index.pck", 1, 3)),
	mergeFiles(getParts("index.wasm", 1, 2)),
]).then(([pckUrl, wasmUrl]) => {

	window.fetch = function(url, ...args) {
		if (url.endsWith("index.pck")) return originalFetch(pckUrl, ...args);
		if (url.endsWith("index.wasm")) return originalFetch(wasmUrl, ...args);
		return originalFetch(url, ...args);
	};

	window.godotrunfunction();
});
</script>

<script src="index.js"></script>

<script>
const GODOT_CONFIG = {
	args: [],
	canvasResizePolicy: 2,
	ensureCrossOriginIsolationHeaders: true,
	executable: "index",
	fileSizes: {
		"index.pck": 50031416,
		"index.wasm": 36145869
	},
	serviceWorker: "index.service.worker.js"
};

const engine = new Engine(GODOT_CONFIG);

window.godotrunfunction = function () {
	const overlay = document.getElementById("status");
	const progress = document.getElementById("status-progress");
	const notice = document.getElementById("status-notice");

	function show(mode) {
		if (mode === "hidden") {
			overlay.remove();
			return;
		}
		overlay.style.visibility = "visible";
		progress.style.display = mode === "progress" ? "block" : "none";
		notice.style.display = mode === "notice" ? "block" : "none";
	}

	function fail(err) {
		console.error(err);
		show("notice");
	}

	const missing = Engine.getMissingFeatures({
		threads: false
	});

	if (missing.length) {
		fail("Missing features:\n" + missing.join("\n"));
		return;
	}

	show("progress");

	engine.startGame({
		onProgress(current, total) {
			if (total) {
				progress.value = current;
				progress.max = total;
			}
		}
	}).then(() => {
		show("hidden");
		window.loadingtexta.remove();
	}, fail);
};
</script>

</body>
