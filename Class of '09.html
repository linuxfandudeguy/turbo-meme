<script>
function mergeFiles(fileParts) {
    return new Promise((resolve, reject) => {
        let buffers = [];

        function fetchPart(i) {
            if (i >= fileParts.length) {
                resolve(URL.createObjectURL(new Blob(buffers)));
                return;
            }
            fetch(fileParts[i])
                .then(r => r.arrayBuffer())
                .then(d => {
                    buffers.push(d);
                    fetchPart(i + 1);
                })
                .catch(reject);
        }

        fetchPart(0);
    });
}

function getParts(file, start, end) {
    let parts = [];
    for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
    }
    return parts;
}

mergeFiles(getParts("game.zip", 1, 2)).then(url => {
    window.gameZipUrl = url;

    const renpypre = document.createElement("script");
    renpypre.src = "https://raw.githack.com/genizy/web-port/main/class-of-09/renpy-pre.js";

    const renpy = document.createElement("script");
    renpy.src = "https://raw.githack.com/genizy/web-port/main/class-of-09/renpy.js";

    document.body.appendChild(renpypre);
    document.body.appendChild(renpy);
});
</script>
