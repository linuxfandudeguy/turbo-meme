<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://raw.githack.com/genizy/web-port/main/baldi-plus/">

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Baldi's Basics Plus</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
#sidebarad1,
#sidebarad2 {
  display: none;
}
  </style>
</head>

<body>
  <div id="loading-text"
       style="color:black;font-size:48px;font-family:cursive;text-align:center;margin-top:20px;">
    LOADING...
  </div>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    const loadingText = document.querySelector("#loading-text");

    let totalBytes = 315673804.8;
    let loadedBytes = 0;

    function formatSize(bytes) {
      if (bytes > 1024 * 1024 * 1024) return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
      if (bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + " MB";
      if (bytes > 1024) return (bytes / 1024).toFixed(2) + " KB";
      return bytes + " B";
    }

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();

      let chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);

        const doneText = formatSize(loadedBytes);
        const totalText = formatSize(totalBytes);
        const percent = ((loadedBytes / totalBytes) * 100).toFixed(1);

        loadingText.textContent =
          `LOADING... ${doneText} / ${totalText} (${percent}%)`;
      }

      let fullBuffer = new Uint8Array(received);
      let offset = 0;

      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }

      return fullBuffer.buffer;
    }

    async function mergeFiles(parts) {
      const buffers = await Promise.all(parts.map(fetchWithProgress));
      return URL.createObjectURL(new Blob(buffers));
    }

    function getParts(file, count) {
      let parts = [];
      for (let i = 1; i <= count; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }

    (async () => {
      const dataParts = getParts("Build/BaldiPlusNew.data", 5);
      const wasmParts = getParts("Build/BaldiPlusNew.wasm", 2);

      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(dataParts),
        mergeFiles(wasmParts),
      ]);

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/BaldiPlusNew.loader.js";

      const config = {
        dataUrl,
        frameworkUrl: buildUrl + "/BaldiPlusNew.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Basically Games",
        productName: "Baldi's Basics Plus",
        productVersion: "0.12.2a",
      };

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(
          document.querySelector("#unity-canvas"),
          config,
          (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width =
              100 * progress + "%";
          }
        ).then(() => {
          loadingText.remove();
          document.querySelector("#unity-loading-bar").style.display = "none";
        });
      };

      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
